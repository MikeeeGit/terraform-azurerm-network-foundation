# Azure Repos PR checks are enforced by main branch build-validation policy.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
resources:
  repositories:
    - repository: deliveryTemplates
      type: git
      name: terraform-delivery-templates
      ref: 50ba5619ce143b9d142790691bc13e13c3ef809a
jobs:
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: TerraformRoot
      directory: .
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example1
      directory: examples/basic
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example2
      directory: examples/hub-spoke
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example3
      directory: examples/hub-spoke/.terraform/modules/network.subnets
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example4
      directory: examples/hub-spoke/.terraform/modules/network.subnets/examples/basic
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example5
      directory: examples/hub-spoke/.terraform/modules/network.vnet
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example6
      directory: examples/hub-spoke/.terraform/modules/network.vnet/examples/basic
